[project]
name = "interactive-todo-app"
version = "0.1.0"
description = "An interactive CLI todo application with curses-based UI"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
todo-app = "todo_app.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "flake8>=5.0",
    "black>=23.0",
    "mypy>=1.0"
]